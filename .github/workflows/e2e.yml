name: E2E

# Pushes to main run this through the Release workflow, and those runs count
# as Release runs. The E2E badge shows this workflow's own runs on main: the
# nightly one and manual ones (gh workflow run e2e.yml --ref main).
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read

jobs:
  # Whether the pull request touches anything but documentation (see
  # .github/scripts/code-changed.sh). Without code the jobs below skip,
  # which counts as passing for the checks the main ruleset requires.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            .github/scripts/code-changed.sh "$BASE" "$HEAD" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  # A YouTrack of the run's own in Docker, started by the harness: nothing
  # is shared with other runs, and no secrets are needed, so pull requests
  # from forks and Dependabot run it too. Releases depend on this job.
  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # Only a newer push to the same pull request cancels its run.
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('e2e-{0}', github.ref) || format('e2e-run-{0}', github.run_id) }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: go test -tags e2e
        run: go test -tags e2e -count=1 -v ./e2e

  # The shared instance, nightly and on demand: a hosted YouTrack that may
  # get API changes before the Docker image does. It is down or read-only now
  # and then; the run then says so instead of failing (see e2e/harness_test.go).
  shared:
    # Not when Release calls this workflow: a called workflow sees its
    # caller's event and name, and a dispatched Release passes no secrets.
    if: github.workflow == 'E2E' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    # Runs keep to their own objects there, so they may overlap.
    concurrency:
      group: e2e-shared-${{ github.run_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: E2E on the shared instance
        env:
          YOUTRACK_E2E_ENDPOINT: ${{ secrets.YOUTRACK_E2E_ENDPOINT }}
          YOUTRACK_E2E_LOGIN: ${{ secrets.YOUTRACK_E2E_LOGIN }}
          YOUTRACK_E2E_PASSWORD: ${{ secrets.YOUTRACK_E2E_PASSWORD }}
        run: |
          [ -n "$YOUTRACK_E2E_ENDPOINT" ] || { echo "::error::No YOUTRACK_E2E_* secrets"; exit 1; }
          # The compiled binary keeps the harness's exit code, which go test
          # turns into 1: 3 means the instance was unavailable.
          go test -c -tags e2e -o "$RUNNER_TEMP/e2e.test" ./e2e
          cd e2e
          code=0
          "$RUNNER_TEMP/e2e.test" -test.v -test.count=1 || code=$?
          if [ "$code" = 3 ]; then
            echo "::warning title=YouTrack unavailable::The shared instance was down or read-only, so this run tested nothing"
            echo "E2E on the shared instance: YouTrack was unavailable, nothing was tested" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit "$code"
