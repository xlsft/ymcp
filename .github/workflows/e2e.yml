name: E2E

# Pushes to main run this through the Release workflow, and those runs count
# as Release runs. The E2E badge shows this workflow's own runs on main: the
# nightly one and manual ones (gh workflow run e2e.yml --ref main).
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read

jobs:
  e2e:
    # Secrets aren't available to pull requests from forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # The tests share one YouTrack instance, so runs never overlap, also when
    # the release workflow calls this one.
    concurrency:
      group: e2e
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: go test -tags e2e
        env:
          YOUTRACK_E2E_ENDPOINT: ${{ secrets.YOUTRACK_E2E_ENDPOINT }}
          YOUTRACK_E2E_LOGIN: ${{ secrets.YOUTRACK_E2E_LOGIN }}
          YOUTRACK_E2E_PASSWORD: ${{ secrets.YOUTRACK_E2E_PASSWORD }}
        run: go test -tags e2e -count=1 -v ./e2e
      # Dependabot's pull requests get no repository secrets, and the suite
      # then skips; say so instead of passing quietly.
      - name: Skipped
        if: env.ENDPOINT == ''
        env:
          ENDPOINT: ${{ secrets.YOUTRACK_E2E_ENDPOINT }}
        run: |
          echo "::warning::No YOUTRACK_E2E_* secrets, so the E2E suite skipped; main runs it before releasing"
          echo "E2E skipped: no YOUTRACK_E2E_* secrets in this run" >> "$GITHUB_STEP_SUMMARY"
