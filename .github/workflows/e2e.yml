name: E2E

# Pushes to main run this through the Release workflow, and those runs count
# as Release runs. The E2E badge shows this workflow's own runs on main: the
# nightly one and manual ones (gh workflow run e2e.yml --ref main).
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read

jobs:
  # Whether the pull request touches anything but documentation (see
  # .github/scripts/code-changed.sh). Without code the jobs below skip,
  # which counts as passing for the checks the main ruleset requires.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            .github/scripts/code-changed.sh "$BASE" "$HEAD" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  e2e:
    needs: changes
    # Secrets aren't available to pull requests from forks.
    if: >-
      needs.changes.outputs.code == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    # Runs share one YouTrack instance but keep to their own objects (see
    # e2e/harness_test.go), so they may overlap. A shared group would hold a
    # single pending run and cancel it for the next one, a release's
    # included. Only a newer push to the same pull request cancels its run.
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('e2e-{0}', github.ref) || format('e2e-run-{0}', github.run_id) }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: go test -tags e2e
        env:
          YOUTRACK_E2E_ENDPOINT: ${{ secrets.YOUTRACK_E2E_ENDPOINT }}
          YOUTRACK_E2E_LOGIN: ${{ secrets.YOUTRACK_E2E_LOGIN }}
          YOUTRACK_E2E_PASSWORD: ${{ secrets.YOUTRACK_E2E_PASSWORD }}
        run: go test -tags e2e -count=1 -v ./e2e
      # Dependabot's pull requests get no repository secrets, and the suite
      # then skips; say so instead of passing quietly.
      - name: Skipped
        if: env.ENDPOINT == ''
        env:
          ENDPOINT: ${{ secrets.YOUTRACK_E2E_ENDPOINT }}
        run: |
          echo "::warning::No YOUTRACK_E2E_* secrets, so the E2E suite skipped; main runs it before releasing"
          echo "E2E skipped: no YOUTRACK_E2E_* secrets in this run" >> "$GITHUB_STEP_SUMMARY"
