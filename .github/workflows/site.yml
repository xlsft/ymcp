name: Site

# Draws the TUI screens (TestScreens) and writes the site's data
# (internal/site) from main, then publishes both on the site branch, where
# the page and the README read them:
#
#   https://raw.githubusercontent.com/xlsft/ymcp/site/site.json
#   https://raw.githubusercontent.com/xlsft/ymcp/site/screens/board.png
#
# The branch holds generated files only. A commit lands there only when
# the data or a screen's text changed, not on every rebuild of the same
# pictures. Pull requests build everything and attach it to the run.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - internal/pipeline/tui/**
      - internal/site/**
      - .github/scripts/screens.py
      - .github/workflows/site.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the site branch
    env:
      FONT_VERSION: "2.304"
      FONT_SHA256: 6f6376c6ed2960ea8a963cd7387ec9d76e3f629125bc33d1fdcd7eb7012f7bbf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Screens and data
        run: |
          mkdir -p ans out
          YMCP_SCREENS="$PWD/ans" go test -count=1 -run TestScreens ./internal/pipeline/tui/views
          YMCP_SITE="$PWD/out" go test -count=1 -run TestSiteData ./internal/site
      - name: JetBrains Mono
        run: |
          curl -fsSL -o font.zip "https://github.com/JetBrains/JetBrainsMono/releases/download/v$FONT_VERSION/JetBrainsMono-$FONT_VERSION.zip"
          echo "$FONT_SHA256  font.zip" | sha256sum -c -
          unzip -q -j font.zip fonts/webfonts/JetBrainsMono-Regular.woff2 fonts/webfonts/JetBrainsMono-Bold.woff2 \
            fonts/webfonts/JetBrainsMono-Italic.woff2 -d font
      - name: Pictures
        run: python3 .github/scripts/screens.py ans font out/screens
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: out
          retention-days: 7
      - name: Publish
        if: github.ref == 'refs/heads/main'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch -q --depth=1 origin site; then
            git worktree add -q -B site pub FETCH_HEAD
          else
            git worktree add -q --orphan -b site pub
          fi
          rm -rf pub/screens pub/site.json
          cp -R out/. pub/
          cd pub
          git add -A
          # Chrome's pictures differ by a few bytes from run to run; the
          # text they are drawn from doesn't.
          if git rev-parse -q --verify HEAD >/dev/null && git diff --cached --quiet -- site.json 'screens/*.html'; then
            echo "Site data and screens unchanged" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -q -m "site: ${GITHUB_SHA::7}"
          git push -q origin site
          echo "Published site data and screens from ${GITHUB_SHA::7}" >> "$GITHUB_STEP_SUMMARY"
