name: Site

# Draws the TUI screens (TestScreens), writes the site's data
# (internal/site) and builds the landing page (site/index.html) from main,
# then publishes them on the site branch, where the page, the README and
# site/docker-compose.yaml read them:
#
#   https://raw.githubusercontent.com/xlsft/ymcp/site/index.html
#   https://raw.githubusercontent.com/xlsft/ymcp/site/site.json
#   https://raw.githubusercontent.com/xlsft/ymcp/site/screens/board.png
#
# The branch holds generated files only. A commit lands there only when
# the page, the data or a screen's text changed, not on every rebuild of
# the same pictures. Pull requests build everything and attach it to the run.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - internal/pipeline/tui/**
      - internal/site/**
      - site/**
      - docs/loader-black.gif
      - .github/scripts/screens.py
      - .github/scripts/site.py
      - .github/workflows/site.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the site branch
    env:
      # JetBrains Mono Nerd Font: the braille spinner and other terminal
      # glyphs plain JetBrains Mono lacks.
      FONT_VERSION: v3.5.1
      FONT_SHA256: 04d5e8f903693f9dd13e16f867e994834e681eb3c72c0d337a770dcda09010cf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Screens and data
        run: |
          mkdir -p ans out
          YMCP_SCREENS="$PWD/ans" go test -count=1 -run TestScreens ./internal/pipeline/tui/views
          YMCP_SITE="$PWD/out" go test -count=1 -run TestSiteData ./internal/site
      - name: JetBrains Mono Nerd Font
        run: |
          curl -fsSL -o font.tar.xz "https://github.com/ryanoasis/nerd-fonts/releases/download/$FONT_VERSION/JetBrainsMono.tar.xz"
          echo "$FONT_SHA256  font.tar.xz" | sha256sum -c -
          mkdir font
          tar -xJf font.tar.xz -C font JetBrainsMonoNerdFontMono-Regular.ttf JetBrainsMonoNerdFontMono-Bold.ttf \
            JetBrainsMonoNerdFontMono-Italic.ttf
      - name: Pictures
        run: python3 .github/scripts/screens.py ans font out/screens
      - name: Page
        run: python3 .github/scripts/site.py site/index.html out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: out
          retention-days: 7
      - name: Publish
        if: github.ref == 'refs/heads/main'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch -q --depth=1 origin site; then
            git worktree add -q -B site pub FETCH_HEAD
          else
            git worktree add -q --orphan -b site pub
          fi
          rm -rf pub/screens pub/site.json pub/index.html
          cp -R out/. pub/
          cd pub
          git add -A
          # Chrome's pictures differ by a few bytes from run to run; the
          # text they are drawn from doesn't.
          if git rev-parse -q --verify HEAD >/dev/null && git diff --cached --quiet -- index.html site.json 'screens/*.html'; then
            echo "Site page, data and screens unchanged" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -q -m "site: ${GITHUB_SHA::7}"
          git push -q origin site
          echo "Published the site page, data and screens from ${GITHUB_SHA::7}" >> "$GITHUB_STEP_SUMMARY"
