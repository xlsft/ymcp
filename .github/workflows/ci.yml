name: CI

# Pushes to main run this through the Release workflow.
on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# A new push to a pull request cancels its older CI. Runs called by Release
# get a group of their own: sharing ci-refs/heads/main let a newer release
# cancel an older one's CI and then wait behind its stuck jobs.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-{0}', github.ref) || format('ci-run-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "Run gofmt on:"; echo "$unformatted"; exit 1; fi
      - name: go mod tidy
        run: go mod tidy -diff
      - run: go vet ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: go test
        # pipefail: the default shell would let tee hide a failing go test.
        shell: bash
        run: |
          set -o pipefail
          go test -race -count=1 -coverprofile=coverage.out ./... | tee test.out
      - name: Coverage summary
        if: matrix.os == 'ubuntu-latest'
        run: |
          {
            echo '### Unit test coverage'
            echo '```'
            awk '/coverage:/ { pkg = ($1 == "ok") ? $2 : $1; sub("github.com/xlsft/ymcp/", "", pkg); for (i = 1; i <= NF; i++) if ($i == "coverage:") print pkg, $(i+1) }' test.out | column -t
            echo "total $(go tool cover -func=coverage.out | tail -1 | awk '{print $NF}')"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build ./...

  goreleaser-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: check

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Go cross-compiles, so both platforms build without emulation.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
