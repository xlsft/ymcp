name: CI

# Pushes to main run this through the Release workflow.
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
  # Weekly, so govulncheck catches newly published vulnerabilities between
  # changes.
  schedule:
    - cron: "41 5 * * 1"

permissions:
  contents: read

# A new push to a pull request cancels its older CI. Runs called by Release
# get a group of their own: sharing ci-refs/heads/main let a newer release
# cancel an older one's CI and then wait behind its stuck jobs.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-{0}', github.ref) || format('ci-run-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  # Whether the pull request touches anything but documentation (see
  # .github/scripts/code-changed.sh). Without code the jobs below skip,
  # which counts as passing for the checks the main ruleset requires.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            .github/scripts/code-changed.sh "$BASE" "$HEAD" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "Run gofmt on:"; echo "$unformatted"; exit 1; fi
      - name: go mod tidy
        run: go mod tidy -diff
      - run: go vet ./...
      - run: go tool staticcheck ./...
      # Fails on vulnerabilities our code can reach, in dependencies and in
      # the standard library of the Go version go.mod names.
      - run: go tool govulncheck ./...

  test:
    # Gated per step, not per job: a matrix job skipped whole reports one
    # "test" check instead of the two the ruleset requires.
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code == 'true'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: needs.changes.outputs.code == 'true'
        with:
          go-version-file: go.mod
      - name: go test
        if: needs.changes.outputs.code == 'true'
        # pipefail: the default shell would let tee hide a failing go test.
        shell: bash
        run: |
          set -o pipefail
          go test -race -count=1 -coverprofile=coverage.out ./... | tee test.out
      - name: Coverage summary
        if: needs.changes.outputs.code == 'true' && matrix.os == 'ubuntu-latest'
        run: |
          {
            echo '### Unit test coverage'
            echo '```'
            awk '/coverage:/ { pkg = ($1 == "ok") ? $2 : $1; sub("github.com/xlsft/ymcp/", "", pkg); for (i = 1; i <= NF; i++) if ($i == "coverage:") print pkg, $(i+1) }' test.out | column -t
            echo "total $(go tool cover -func=coverage.out | tail -1 | awk '{print $NF}')"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  build-windows:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build ./...

  goreleaser-check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: check

  docker:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Go cross-compiles, so both platforms build without emulation.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
