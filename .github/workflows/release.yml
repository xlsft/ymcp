name: Release

# Every push to main is checked by CI and E2E. When both pass and the
# conventional commits since the last tag call for it (feat, fix, perf or a
# breaking change), the next version is tagged and published. Nobody tags by
# hand.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only by default; the jobs that tag, publish or sign ask for more.
permissions:
  contents: read

jobs:
  # Whether anything but documentation changed since the last release (see
  # .github/scripts/code-changed.sh). Without code, CI and E2E don't run,
  # and nothing is released.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = push ]; then
            .github/scripts/code-changed.sh >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  ci:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/ci.yml

  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/e2e.yml
    secrets: inherit

  release:
    needs: [ci, e2e]
    runs-on: ubuntu-latest
    # Releases never overlap, but only this job waits its turn: a run whose
    # checks are stuck, e.g. on a macOS runner, doesn't hold up newer ones,
    # and it releases nothing once main has moved on.
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write # keyless Sigstore signing of checksums.txt and the provenance
      attestations: write # the build provenance GitHub keeps
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Next version
        id: version
        run: |
          # A newer push has its own run, which releases everything; tagging
          # this older commit would race it, and GitHub refuses a tag whose
          # workflows differ from main's.
          git fetch -q origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "No release: main moved on to $(git rev-parse --short origin/main), whose run releases" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          version=$(.github/scripts/next-version.sh)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -n "$version" ]; then
            echo "Releasing $version" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No release: no feat, fix, perf or breaking commits since the last tag" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Tag
        if: steps.version.outputs.version != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.version }}" -m "${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}"
      # What the release changed for its users, from the commits' Changelog:
      # trailers (see .github/scripts/changelog.py), above GoReleaser's list
      # of commits.
      - name: Release notes
        if: steps.version.outputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 .github/scripts/changelog.py notes "$VERSION" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.version.outputs.version != ''
        with:
          go-version-file: go.mod
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        if: steps.version.outputs.version != ''
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        if: steps.version.outputs.version != ''
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        if: steps.version.outputs.version != ''
        with:
          version: "~> v2"
          args: release --clean --release-header ${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pushes to xlsft/homebrew-tap and xlsft/scoop-bucket.
          YMCP_PACKAGES_TOKEN: ${{ secrets.YMCP_PACKAGES_TOKEN }}
      # SLSA build provenance of every file checksums.txt lists: GitHub keeps
      # it as an attestation, and the release carries its Sigstore bundle
      # as ymcp.intoto.jsonl.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: attest
        if: steps.version.outputs.version != ''
        with:
          subject-checksums: dist/checksums.txt
      - name: Attach the provenance
        if: steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" ymcp.intoto.jsonl
          gh release upload "$VERSION" ymcp.intoto.jsonl

  docker:
    needs: release
    if: needs.release.outputs.version != ''
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/docker.yml
    with:
      version: ${{ needs.release.outputs.version }}
    secrets: inherit

  # Lists the release in the MCP Registry as io.github.xlsft/ymcp, the image
  # Docker just pushed run over stdio. The registry checks the image's
  # io.modelcontextprotocol.server.name label, so this waits for the push.
  mcp-registry:
    needs: [release, docker]
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # GitHub OIDC sign-in to the registry's io.github.xlsft namespace
    env:
      MCP_PUBLISHER_VERSION: v1.8.6
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - name: Install mcp-publisher
        run: |
          archive=mcp-publisher_linux_amd64.tar.gz
          base=https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION
          curl -fsSL -O "$base/$archive" -O "$base/$archive.sigstore.json"
          cosign verify-blob "$archive" --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/$MCP_PUBLISHER_VERSION" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          tar xzf "$archive" mcp-publisher
      - name: Publish
        run: |
          v=${VERSION#v}
          jq --arg v "$v" '.version = $v | .packages[0].identifier = "docker.io/xlsoftware/ymcp:\($v)"' server.json > server.tmp
          mv server.tmp server.json
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
          echo "Listed io.github.xlsft/ymcp $v in the [MCP Registry](https://registry.modelcontextprotocol.io/v0/servers?search=io.github.xlsft/ymcp)" >> "$GITHUB_STEP_SUMMARY"
