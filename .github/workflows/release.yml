name: Release

# Every push to main is checked by CI and E2E. When both pass and the
# conventional commits since the last tag call for it (feat, fix, perf or a
# breaking change), the next version is tagged and published. Nobody tags by
# hand.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only by default; the jobs that tag, publish or sign ask for more.
permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  e2e:
    uses: ./.github/workflows/e2e.yml
    secrets: inherit

  release:
    needs: [ci, e2e]
    runs-on: ubuntu-latest
    # Releases never overlap, but only this job waits its turn: a run whose
    # checks are stuck, e.g. on a macOS runner, doesn't hold up newer ones,
    # and it releases nothing once main has moved on.
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write # keyless Sigstore signing of checksums.txt
    outputs:
      version: ${{ steps.version.outputs.version }}
      hashes: ${{ steps.hashes.outputs.hashes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Next version
        id: version
        run: |
          # A newer push has its own run, which releases everything; tagging
          # this older commit would race it, and GitHub refuses a tag whose
          # workflows differ from main's.
          git fetch -q origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "No release: main moved on to $(git rev-parse --short origin/main), whose run releases" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          version=$(.github/scripts/next-version.sh)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -n "$version" ]; then
            echo "Releasing $version" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No release: no feat, fix, perf or breaking commits since the last tag" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Tag
        if: steps.version.outputs.version != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.version }}" -m "${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.version.outputs.version != ''
        with:
          go-version-file: go.mod
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        if: steps.version.outputs.version != ''
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        if: steps.version.outputs.version != ''
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        if: steps.version.outputs.version != ''
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pushes to xlsft/homebrew-tap and xlsft/scoop-bucket.
          YMCP_PACKAGES_TOKEN: ${{ secrets.YMCP_PACKAGES_TOKEN }}
      # The subjects of the provenance: every released file with its
      # SHA-256, as checksums.txt lists them.
      - name: Provenance subjects
        id: hashes
        if: steps.version.outputs.version != ''
        run: echo "hashes=$(base64 -w0 dist/checksums.txt)" >> "$GITHUB_OUTPUT"

  # SLSA build provenance of the release's files, uploaded to the release
  # as ymcp.intoto.jsonl. The generator is referenced by tag, as it requires.
  provenance:
    needs: release
    if: needs.release.outputs.version != ''
    permissions:
      actions: read # the workflow run the provenance describes
      id-token: write # signing the provenance
      contents: write # uploading it to the release
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.release.outputs.hashes }}
      provenance-name: ymcp.intoto.jsonl
      upload-assets: true
      upload-tag-name: ${{ needs.release.outputs.version }}

  docker:
    needs: release
    if: needs.release.outputs.version != ''
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/docker.yml
    with:
      version: ${{ needs.release.outputs.version }}
    secrets: inherit

  # Lists the release in the MCP Registry as io.github.xlsft/ymcp, the image
  # Docker just pushed run over stdio. The registry checks the image's
  # io.modelcontextprotocol.server.name label, so this waits for the push.
  mcp-registry:
    needs: [release, docker]
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # GitHub OIDC sign-in to the registry's io.github.xlsft namespace
    env:
      MCP_PUBLISHER_VERSION: v1.8.6
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - name: Install mcp-publisher
        run: |
          archive=mcp-publisher_linux_amd64.tar.gz
          base=https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION
          curl -fsSL -O "$base/$archive" -O "$base/$archive.sigstore.json"
          cosign verify-blob "$archive" --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/$MCP_PUBLISHER_VERSION" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          tar xzf "$archive" mcp-publisher
      - name: Publish
        run: |
          v=${VERSION#v}
          jq --arg v "$v" '.version = $v | .packages[0].identifier = "docker.io/xlsoftware/ymcp:\($v)"' server.json > server.tmp
          mv server.tmp server.json
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
          echo "Listed io.github.xlsft/ymcp $v in the [MCP Registry](https://registry.modelcontextprotocol.io/v0/servers?search=io.github.xlsft/ymcp)" >> "$GITHUB_STEP_SUMMARY"
