name: winget

# Validates and installs the winget manifest a release pushed to the
# xlsft/winget-pkgs fork, on Windows, the way winget-pkgs reviewers ask, then
# ticks the checklist of the release's winget-pkgs pull request (see
# .github/scripts/winget-checklist.sh). Release calls it for every new
# version; run it by hand for an existing one:
#
#   gh workflow run winget.yml -f version=0.9.2
#
# Ticking the checklist needs the YMCP_PACKAGES_TOKEN secret, the token that
# opened the pull request; without it that job is skipped.
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Package version, e.g. 0.9.2
        type: string
        required: true

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-2025
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Get the manifest from the fork
        shell: pwsh
        run: |
          $env:VERSION = $env:VERSION.TrimStart("v")
          "VERSION=$env:VERSION" >> $env:GITHUB_ENV
          $dir = "manifest"
          New-Item -ItemType Directory $dir | Out-Null
          foreach ($f in "xlsft.ymcp.yaml", "xlsft.ymcp.installer.yaml", "xlsft.ymcp.locale.en-US.yaml") {
            $url = "https://raw.githubusercontent.com/xlsft/winget-pkgs/ymcp-$env:VERSION/manifests/x/xlsft/ymcp/$env:VERSION/$f"
            Invoke-WebRequest $url -OutFile "$dir/$f"
          }
          Get-ChildItem $dir
      # The runner's winget may predate the manifest schema winget-pkgs asks
      # for; it then only warns about the schema header. Updating winget on
      # Windows Server fails, so the check runs with what is there.
      - name: winget version
        shell: pwsh
        run: winget --version
      - name: winget validate
        shell: pwsh
        run: |
          $out = winget validate --manifest manifest --disable-interactivity | Out-String
          $code = $LASTEXITCODE
          Write-Output $out
          Write-Output "exit code: $code"
          # Valid with warnings exits non-zero too; the warnings are above.
          if ($out -notmatch "Manifest validation succeeded") { exit 1 }
          exit 0
      - name: winget install
        shell: pwsh
        run: |
          winget settings --enable LocalManifestFiles
          winget install --manifest manifest --accept-package-agreements --accept-source-agreements --disable-interactivity
          $env:Path = [Environment]::GetEnvironmentVariable("Path", "Machine") + ";" + [Environment]::GetEnvironmentVariable("Path", "User")
          ymcp version
          if ((ymcp version) -notmatch [regex]::Escape($env:VERSION)) { throw "installed ymcp reports another version" }

  checklist:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tick the pull request checklist
        env:
          GH_TOKEN: ${{ secrets.YMCP_PACKAGES_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "No YMCP_PACKAGES_TOKEN; checklist left as is" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          .github/scripts/winget-checklist.sh "$VERSION" | tee -a "$GITHUB_STEP_SUMMARY"
