name: Docker

# Pushes the image of a release to Docker Hub as <version>, <major.minor>
# and latest. Release calls it for every new version; run it by hand to
# publish an existing tag:
#
#   gh workflow run docker.yml -f version=v0.5.0
#
# Needs the DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets; the
# DOCKERHUB_IMAGE variable overrides the repository name.
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Release tag, e.g. v0.5.0
        type: string
        required: true

permissions:
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ vars.DOCKERHUB_IMAGE || 'xlsft/ymcp' }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: Docker Hub credentials
        id: creds
        env:
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No DOCKERHUB_TOKEN secret, so no image was pushed"
          fi
      - uses: actions/checkout@v7
        if: steps.creds.outputs.ok == 'true'
        with:
          ref: ${{ inputs.version }}
      - uses: docker/setup-buildx-action@v3
        if: steps.creds.outputs.ok == 'true'
      - uses: docker/login-action@v3
        if: steps.creds.outputs.ok == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        if: steps.creds.outputs.ok == 'true'
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }}
            type=raw,value=latest
      # Go cross-compiles, so both platforms build without emulation.
      - uses: docker/build-push-action@v6
        if: steps.creds.outputs.ok == 'true'
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ inputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
      - name: Summary
        if: steps.creds.outputs.ok == 'true'
        run: echo "Pushed $IMAGE:${VERSION#v}" >> "$GITHUB_STEP_SUMMARY"
