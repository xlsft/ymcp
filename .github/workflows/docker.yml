name: Docker

# Pushes the image of a release to Docker Hub as <version>, <major.minor>
# and latest. Release calls it for every new version; run it by hand to
# publish an existing tag:
#
#   gh workflow run docker.yml -f version=v0.5.0
#
# Needs the YOUTRACK_DOCKERHUB_LOGIN and YOUTRACK_DOCKERHUB_TOKEN secrets;
# the image is <login>/ymcp unless the DOCKERHUB_IMAGE variable says
# otherwise.
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Release tag, e.g. v0.5.0
        type: string
        required: true

permissions:
  contents: read
  id-token: write # keyless Sigstore signature of the image

jobs:
  push:
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ vars.DOCKERHUB_IMAGE || format('{0}/ymcp', secrets.YOUTRACK_DOCKERHUB_LOGIN) }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: Docker Hub credentials
        id: creds
        env:
          TOKEN: ${{ secrets.YOUTRACK_DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No YOUTRACK_DOCKERHUB_TOKEN secret, so no image was pushed"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.creds.outputs.ok == 'true'
        with:
          ref: ${{ inputs.version }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.creds.outputs.ok == 'true'
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: steps.creds.outputs.ok == 'true'
        with:
          username: ${{ secrets.YOUTRACK_DOCKERHUB_LOGIN }}
          password: ${{ secrets.YOUTRACK_DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        if: steps.creds.outputs.ok == 'true'
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }}
            type=raw,value=latest
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: steps.creds.outputs.ok == 'true'
      # Go cross-compiles, so both platforms build without emulation. The
      # image carries an SBOM and build provenance as attestations.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: steps.creds.outputs.ok == 'true'
        id: build
        with:
          sbom: true
          provenance: mode=max
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ inputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
      - name: Sign
        if: steps.creds.outputs.ok == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - name: Summary
        if: steps.creds.outputs.ok == 'true'
        run: echo "Pushed and signed $IMAGE:${VERSION#v}" >> "$GITHUB_STEP_SUMMARY"
