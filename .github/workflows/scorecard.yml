name: Scorecard

# OpenSSF Scorecard: how the repository's supply chain measures up (pinned
# actions, token permissions, signed releases, branch rules and so on).
# Results go to the Security tab and to the public badge in the README.
on:
  push:
    branches: [main]
  branch_protection_rule:
  schedule:
    - cron: "33 5 * * 1"
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload the results to code scanning
      id-token: write # publish them to the Scorecard API for the badge
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@v2
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
