version: 2

project_name: ymcp

builds:
  - id: ymcp
    main: ./cmd/ymcp
    binary: ymcp
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: ymcp
    # No version in the name, so releases/latest/download/<name> always works.
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: checksums.txt

# A software bill of materials for each archive, made by syft.
sboms:
  - artifacts: archive

# checksums.txt, which covers every archive and SBOM, is signed keylessly
# with Sigstore by the Release workflow's GitHub identity.
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args: ["sign-blob", "--bundle=${signature}", "${artifact}", "--yes"]

# Package managers. Their repositories are outside this one, so publishing
# needs the YMCP_PACKAGES_TOKEN secret; without it they are skipped.

homebrew_casks:
  - name: ymcp
    repository:
      owner: xlsft
      name: homebrew-tap
      token: '{{ envOrDefault "YMCP_PACKAGES_TOKEN" "" }}'
    homepage: https://github.com/xlsft/ymcp
    description: YouTrack MCP server with the full YouTrack toolset
    license: MIT
    commit_author:
      name: github-actions[bot]
      email: 41898282+github-actions[bot]@users.noreply.github.com
    skip_upload: '{{ if envOrDefault "YMCP_PACKAGES_TOKEN" "" }}false{{ else }}true{{ end }}'
    hooks:
      post:
        # The binary isn't notarized; let it run without Gatekeeper's prompt.
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/ymcp"]
          end

scoops:
  - name: ymcp
    repository:
      owner: xlsft
      name: scoop-bucket
      token: '{{ envOrDefault "YMCP_PACKAGES_TOKEN" "" }}'
    homepage: https://github.com/xlsft/ymcp
    description: YouTrack MCP server with the full YouTrack toolset
    license: MIT
    commit_author:
      name: github-actions[bot]
      email: 41898282+github-actions[bot]@users.noreply.github.com
    skip_upload: '{{ if envOrDefault "YMCP_PACKAGES_TOKEN" "" }}false{{ else }}true{{ end }}'

winget:
  - name: ymcp
    publisher: xlsft
    package_identifier: xlsft.ymcp
    short_description: YouTrack MCP server with the full YouTrack toolset
    description: |
      ymcp gives AI clients (Claude, Cursor, VS Code, Zed, Codex and others) the full YouTrack MCP toolset plus
      deletes, sprints, attachments, history and reports, signing in with a YouTrack login and password.
    license: MIT
    homepage: https://github.com/xlsft/ymcp
    publisher_url: https://github.com/xlsft
    release_notes_url: https://github.com/xlsft/ymcp/releases/tag/{{ .Tag }}
    tags: [youtrack, mcp, cli]
    commit_author:
      name: github-actions[bot]
      email: 41898282+github-actions[bot]@users.noreply.github.com
    skip_upload: '{{ if envOrDefault "YMCP_PACKAGES_TOKEN" "" }}false{{ else }}true{{ end }}'
    repository:
      owner: xlsft
      name: winget-pkgs
      branch: "ymcp-{{ .Version }}"
      token: '{{ envOrDefault "YMCP_PACKAGES_TOKEN" "" }}'
      pull_request:
        enabled: true
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Other
      order: 999
  filters:
    exclude:
      - '^.*?(docs|test|chore|ci|build)(\(.+\))??!?:.+$'

release:
  github:
    owner: xlsft
    name: ymcp
  footer: |
    ## Install

    macOS / Linux:
    ```sh
    curl -fsSL https://raw.githubusercontent.com/xlsft/ymcp/main/install.sh | sh
    ```

    Windows (PowerShell):
    ```powershell
    irm https://raw.githubusercontent.com/xlsft/ymcp/main/install.ps1 | iex
    ```

    Homebrew: `brew install xlsft/tap/ymcp` · Scoop: `scoop bucket add xlsft https://github.com/xlsft/scoop-bucket; scoop install ymcp` · winget: `winget install xlsft.ymcp` (once Microsoft merges the package).

    Already installed: `ymcp update`. Docker: `docker pull xlsoftware/ymcp:{{ .Version }}`.

    ## Verify

    `checksums.txt` is signed with [Sigstore](https://www.sigstore.dev) by this repository's release workflow:
    ```sh
    cosign verify-blob checksums.txt --bundle checksums.txt.sigstore.json \
      --certificate-identity-regexp '^https://github.com/xlsft/ymcp/\.github/workflows/' \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com
    sha256sum --ignore-missing -c checksums.txt
    ```
    Each archive has an SPDX SBOM next to it (`*.sbom.json`).
