# The ymcp landing page on http://localhost:13453, plain HTTP; put TLS in
# front of it elsewhere if it needs it.
#
#   docker compose up -d
#
# nginx serves the page the Site workflow last published on the site branch,
# fetched at start and then every 10 minutes, so it follows main on its own.
# YMCP_SITE_PAGE points it at another copy of the page.
# The page loads its data and TUI screens from the same branch, and fonts from
# Google Fonts.
services:
  site:
    image: nginx:1.28.0-alpine
    ports:
      - "13453:80"
    environment:
      PAGE: ${YMCP_SITE_PAGE:-https://raw.githubusercontent.com/xlsft/ymcp/site/index.html}
      EVERY: "600"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        page=/usr/share/nginx/html/index.html
        fetch() { curl -fsSL "$$PAGE" -o "$$page.new" && mv "$$page.new" "$$page"; }
        fetch || echo "site: can't fetch $$PAGE yet; retrying in $$EVERY s" >&2
        (while sleep "$$EVERY"; do fetch || echo "site: fetching $$PAGE failed" >&2; done) &
        exec nginx -g 'daemon off;'
    restart: unless-stopped
